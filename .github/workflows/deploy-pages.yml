name: Publish Rubik Universe V8 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          set -euo pipefail
          mkdir -p site extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -iname 'Rubik-Universe-V8.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d extracted
            INDEX_FILE="$(find extracted -type f -name index.html -print -quit)"
            if [ -z "$INDEX_FILE" ]; then
              echo 'Rubik-Universe-V8.zip does not contain index.html.' >&2
              exit 1
            fi
            cp "$INDEX_FILE" site/index.html
          elif [ -s index.html ]; then
            cp index.html site/index.html
          else
            echo 'Missing Rubik-Universe-V8.zip or index.html.' >&2
            exit 1
          fi
          touch site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
